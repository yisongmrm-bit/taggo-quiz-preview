 *   第三象限(左下 -x,-y)=熔炉   第四象限(右下 +x,-y)=港湾
 */
const ATLAS = {
  xAxis: { neg: 'mask',   pos: 'mirror' },  // 左 → 右
  yAxis: { neg: 'hammer', pos: 'scepter' }, // 下 → 上

/**
 * 计分引擎 —— 工单 §4。纯函数，无副作用，可单测。
 *
 * 输入约定：
 *   questions: questions.json 的 questions 数组（唯一权威来源）。
 *   answers:   { [qid]: '1' | '2' }，1=左滑/①，2=右滑/②。
 *
 * 计分规则：每答一题，被选项对应神器 += 该题 weight。两轴各满分 12。
 * 结算：每轴取分高神器；两轴胜者组合 → 阵营。平局按 tieBreak 配置裁决。
 */

/** 空白得分表 */
function emptyScores() {
  return { hammer: 0, scepter: 0, mask: 0, mirror: 0 };
}

/** 由 questions 建 id→question 索引 */
function indexQuestions(questions) {
  const m = {};
  for (const q of questions) m[q.id] = q;
  return m;
}

/**
 * 累计各神器得分。
 * @returns {{hammer:number,scepter:number,mask:number,mirror:number}}
 */
function scoreAnswers(answers, questions) {
  const scores = emptyScores();
  const byId = indexQuestions(questions);
  for (const [qid, side] of Object.entries(answers)) {
    const q = byId[qid];
    if (!q) continue;
    const opt = side === '1' ? q.opt1 : side === '2' ? q.opt2 : null;
    if (!opt) continue;
    scores[opt.artifact] += q.weight;
  }
  return scores;
}

/**
 * 裁决单轴胜者（含平局处理）。
 * @param axisKey 'practice' | 'being'
 * @param byId    indexQuestions(questions) 的结果，用于平局时读取决定题的所选神器
 * @returns {{winner:string, tie:boolean}}
 */
function resolveAxis(axisKey, scores, answers, tieBreak, byId) {
  const [a, b] = AXES[axisKey].poles; // practice:[hammer,scepter]  being:[mask,mirror]
  if (scores[a] > scores[b]) return { winner: a, tie: false };
  if (scores[b] > scores[a]) return { winner: b, tie: false };

  // 平局：默认 highestWeightFirstQuestion —— 取该轴最先出现的 3 分题「所选选项对应的神器」获胜。
  // 注意：题内 ①②的神器方向并不总等于 poles 顺序（如 q3 的 opt1=权杖 opt2=铁锤），
  // 因此必须读所选 option 的 artifact，不能按 side 位置硬映射。
  const tb = tieBreak || {};
  if (tb.strategy === 'highestWeightFirstQuestion' && tb.questionByAxis) {
    const qid = tb.questionByAxis[axisKey];
    const q = byId[qid];
    const side = answers[qid];
    const opt = q && (side === '1' ? q.opt1 : side === '2' ? q.opt2 : null);
    if (opt && (opt.artifact === a || opt.artifact === b)) {
      return { winner: opt.artifact, tie: true };
    }
  }
  // 兜底：取 poles[0]（稳定、可预测）
  return { winner: a, tie: true };
}

/**
 * 完整结算：得分、两轴胜者、阵营、归一化坐标。
 */
function computeResult(answers, bank) {
  const questions = bank.questions;
  const tieBreak = bank.tieBreak;
  const scores = scoreAnswers(answers, questions);
  const byId = indexQuestions(questions);

  const practice = resolveAxis('practice', scores, answers, tieBreak, byId);
  const being = resolveAxis('being', scores, answers, tieBreak, byId);

  const factionKey = FACTION_BY_ARTIFACTS[`${practice.winner}+${being.winner}`];

  return {
    scores,
    practiceWinner: practice.winner,
    beingWinner: being.winner,
    tie: { practice: practice.tie, being: being.tie },
    faction: factionKey,
    factionInfo: FACTIONS[factionKey],
    coordinate: toCoordinate(scores),
    answeredCount: Object.keys(answers).length,
  };
}

/**
 * §6/§7 方案A 归一化坐标。
 *   x = (mirror - mask) 映射到 [-range, range]
 *   y = (scepter - hammer) 映射到 [-range, range]
 * 每轴原始差值范围 [-12, 12]，线性缩放到 [-150, 150]（×12.5）。
 */
function toCoordinate(scores) {
  const { xAxis, yAxis, range } = ATLAS;
  const maxDiff = 12; // 单轴满分
  const x = ((scores[xAxis.pos] - scores[xAxis.neg]) / maxDiff) * range;
  const y = ((scores[yAxis.pos] - scores[yAxis.neg]) / maxDiff) * range;
  return { x: round1(x), y: round1(y) };
}

/** 坐标 → 阵营（用于图鉴点位落区校验，应与 computeResult.faction 一致） */
function factionByCoordinate(coord) {
  const sx = coord.x < 0 ? 'neg' : 'pos';
  const sy = coord.y < 0 ? 'neg' : 'pos';
  return ATLAS.quadrantFaction[`${sx},${sy}`];
}

function round1(n) { return Math.round(n * 10) / 10; }

/** 按 UA 挑安卓商店；认不出品牌就落官网落地页 */
function pickAndroidStore(ua) {
  const s = CTA.androidStores;
  if (/huawei|harmonyos|hms/i.test(ua)) return s.huawei;
  if (/honor/i.test(ua)) return s.honor;
  if (/oppo|pclm|cph|heytap|realme/i.test(ua)) return s.oppo;
  if (/vivo/i.test(ua)) return s.vivo;
  if (/xiaomi|redmi|mi\s?\d/i.test(ua)) return s.xiaomi;
  return CTA.iosUniversalLink;
}

/** 试唤起 App；超时仍停留在本页 → 跳兜底链接 */
function tryDeepLink(scheme, fallback) {
  const timer = setTimeout(() => {
    if (!document.hidden) window.location.href = fallback;
  }, 1300);
  window.addEventListener('pagehide', () => clearTimeout(timer), { once: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearTimeout(timer);
  }, { once: true });
  window.location.href = scheme;
}

/** 微信内：引导右上角浏览器打开（scheme/商店在微信里都被拦） */
function showWechatMask() {
  if (document.querySelector('.wx-mask')) return;
  const m = document.createElement('div');
  m.className = 'wx-mask';
  m.innerHTML = `<div class="arr">➹</div>
    <div class="tip">微信里打不开商店啦<br>点右上角 <b>···</b><br>选择「<b>在浏览器中打开</b>」</div>`;
  m.onclick = () => m.remove();
  document.body.appendChild(m);
}

/** 下载/打开 Taggo 的总入口 */
function openTaggo() {
  const ua = navigator.userAgent;
  if (/MicroMessenger/i.test(ua)) { showWechatMask(); return; }
  if (/iPhone|iPad|iPod/i.test(ua)) { tryDeepLink(CTA.uriScheme, CTA.iosStoreUrl); return; }
  if (/Android/i.test(ua)) { tryDeepLink(CTA.androidIntent, pickAndroidStore(ua)); return; }
  window.open(CTA.iosUniversalLink, '_blank');   // 桌面浏览器 → 官网落地页
}

const NS = 'http://www.w3.org/2000/svg';
const R = ATLAS.range;          // 150

const sx = (x) => x;

function el(tag, attrs = {}, parent = null) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
}

/** 四角星（sparkle） */
function starPath(cx, cy, r) {
  const w = r * 0.28;
  return `M${cx},${cy - r} Q${cx + w},${cy - w} ${cx + r},${cy} Q${cx + w},${cy + w} ${cx},${cy + r} `
       + `Q${cx - w},${cy + w} ${cx - r},${cy} Q${cx - w},${cy - w} ${cx},${cy - r} Z`;
}

const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

/** 本页内神器文案统一走 ATLAS.axisEnds（面具→「面具 · 建构」），与四端点口径一致 */
function artifactLabel(key) {
  for (const e of Object.values(ATLAS.axisEnds)) if (e.artifact === key) return e.text;
  return ARTIFACTS[key].label + ' · ' + ARTIFACTS[key].displayLabel;
}

/**
 * @param {HTMLElement} root
 * @param {{faction:string, coordinate:{x:number,y:number}, counts?:Object}} opts
 */
function mountAtlas(root, opts = {}) {
  const myFaction = opts.faction || 'forge';
  const rawCoord = opts.coordinate || { x: -60, y: -40 };
  // 渲染层 clamp：极值答卷（如全①/全②）坐标落在 ±150 边界，收缩到 ±138 避免点位贴边被裁
  const CLAMP = 138;
  let myCoord = {
    x: Math.max(-CLAMP, Math.min(CLAMP, rawCoord.x)),
    y: Math.max(-CLAMP, Math.min(CLAMP, rawCoord.y)),
  };
  // 与代表人物避让：名人坐标是内容本体不动，「你」做最小位移推开。
  // 规则：距任一名人 < MIN_GAP 时沿连线推到 MIN_GAP（完全重合向右推）；迭代3轮；
  // 推完钳回边界且锁死本象限（避让绝不把你推过轴线）。
  {
    const MIN_GAP = 20;
    const all = Object.values(FIGURES).flat();
    const sx0 = Math.sign(myCoord.x) || 1, sy0 = Math.sign(myCoord.y) || 1;
    for (let iter = 0; iter < 3; iter++) {
      let moved = false;
      for (const f of all) {
        const dx = myCoord.x - f.x, dy = myCoord.y - f.y;
        const d = Math.hypot(dx, dy);
        if (d < MIN_GAP) {
          const ux = d > 0.01 ? dx / d : 1, uy = d > 0.01 ? dy / d : 0;
          myCoord = { x: f.x + ux * MIN_GAP, y: f.y + uy * MIN_GAP };
          moved = true;
        }
      }
      if (!moved) break;
    }
    myCoord.x = Math.max(-CLAMP, Math.min(CLAMP, myCoord.x));
    myCoord.y = Math.max(-CLAMP, Math.min(CLAMP, myCoord.y));
    if (Math.sign(myCoord.x) !== sx0) myCoord.x = sx0 * 4;   // 象限锁
    if (Math.sign(myCoord.y) !== sy0) myCoord.y = sy0 * 4;
  }
  const counts = opts.counts || { tower: 54, court: 38, forge: 46, harbor: 50 };

  root.innerHTML = '';
  root.className = 'atlas-root';

  // ── 顶部：您的阵营为 XX ──────────────────────────────────────────────
  const head = document.createElement('div');
  head.className = 'atlas-head';
  head.innerHTML = `
    <div class="atlas-sub">你的思维坐标</div>
    <div class="atlas-name">
      <span class="laurel left"></span><span class="nm">${FACTIONS[myFaction].label}</span><span class="laurel right"></span>
    </div>`;
  root.appendChild(head);

  // ── SVG 画面 ────────────────────────────────────────────────────────
  const wrap = document.createElement('div');
  wrap.className = 'atlas-stage';
  root.appendChild(wrap);

  const svg = el('svg', {
    viewBox: VIEW_FULL.join(' '),
    class: 'atlas-svg',
    preserveAspectRatio: 'xMidYMid meet',
  }, wrap);

  const defs = el('defs', {}, svg);

  // 他方阵营徽章：清晰但去饱和提亮（App 现网截图口径：己方全彩、他方灰）
  const dimBadge = el('filter', { id: 'dimBadge', x: '-20%', y: '-20%', width: '140%', height: '140%' }, defs);
  el('feColorMatrix', { type: 'saturate', values: '0.07', result: 'g' }, dimBadge);
  const ct = el('feComponentTransfer', { in: 'g' }, dimBadge);
  for (const ch of ['feFuncR', 'feFuncG', 'feFuncB']) {
    el(ch, { type: 'linear', slope: '1.5', intercept: '0.04' }, ct);
  }

  // 星点辉光
  const glow = el('filter', { id: 'starGlow', x: '-120%', y: '-120%', width: '340%', height: '340%' }, defs);
  el('feGaussianBlur', { stdDeviation: '2', result: 'b' }, glow);
  const gm = el('feMerge', {}, glow);
  el('feMergeNode', { in: 'b' }, gm);
  el('feMergeNode', { in: 'SourceGraphic' }, gm);

  // 每阵营一个「角落浓、中心淡」的径向渐变 —— 四象限交界处自然过渡
  for (const [key, f] of Object.entries(FACTIONS)) {
    const q = ATLAS.quadrantOf[key];
    const cx = q.sx === 'neg' ? '0%' : '100%';   // 渐变圆心放在该象限的外角
    const cy = q.sy === 'pos' ? '0%' : '100%';
    const g = el('radialGradient', { id: `qg-${key}`, cx, cy, r: '118%' }, defs);
    el('stop', { offset: '0%',   'stop-color': f.accent, 'stop-opacity': '0.30' }, g);
    el('stop', { offset: '52%',  'stop-color': f.accent, 'stop-opacity': '0.10' }, g);
    el('stop', { offset: '100%', 'stop-color': f.accent, 'stop-opacity': '0' }, g);
  }
  // 中心融合：一小片暗色，压住四色交汇
  const cg = el('radialGradient', { id: 'centerMerge', cx: '50%', cy: '50%', r: '50%' }, defs);
  el('stop', { offset: '0%',   'stop-color': '#0E1524', 'stop-opacity': '0.85' }, cg);
  el('stop', { offset: '100%', 'stop-color': '#0E1524', 'stop-opacity': '0' }, cg);

  // 头像圆形裁剪（每位人物一个 clipPath）
  let clipSeq = 0;
  const makeAvatarClip = (r) => {
    const id = `avclip${clipSeq++}`;
    const cp = el('clipPath', { id }, defs);
    el('circle', { cx: 0, cy: 0, r }, cp);
    return id;
  };

  const scene = el('g', { class: 'scene' }, svg);

  // ── 四象限底色 + 虚化徽章 ────────────────────────────────────────────
  const quadLayer = el('g', { class: 'quads' }, scene);
  const emblemLayer = el('g', { class: 'emblems', 'pointer-events': 'none' }, scene);
  const labelLayer = el('g', { class: 'qlabels', 'pointer-events': 'none' }, scene);

  const quadRect = (key) => {
    const q = ATLAS.quadrantOf[key];
    const x = q.sx === 'neg' ? -R : 0;
    const y = q.sy === 'pos' ? -R : 0;   // SVG y：pos(上) → 负
    return { x, y, w: R, h: R, cx: x + R / 2, cy: y + R / 2 };
  };

  for (const key of Object.keys(FACTIONS)) {
    const r = quadRect(key);
    const f = FACTIONS[key];

    const hit = el('g', { class: 'quad', 'data-faction': key, style: 'cursor:pointer' }, quadLayer);
    el('rect', { x: r.x, y: r.y, width: r.w, height: r.h, fill: `url(#qg-${key})` }, hit);
    // 命中区（透明，保证整格可点）
    el('rect', { x: r.x, y: r.y, width: r.w, height: r.h, fill: 'transparent' }, hit);

    // 阵营徽章（清晰主视觉，对齐 App 现网截图；[SLOT] 待透明底正式切图）
    const size = 76;
    const bcid = `bclip-${key}`;
    const bcp = el('clipPath', { id: bcid }, defs);
    el('circle', { cx: r.cx, cy: r.cy - 14, r: size / 2 }, bcp);
    if (key === myFaction) {
      el('circle', { cx: r.cx, cy: r.cy - 14, r: size / 2 + 9, fill: f.accent, opacity: '0.16' }, emblemLayer);
    }
    const im = el('image', {
      href: EMBLEMS[key], x: r.cx - size / 2, y: r.cy - 14 - size / 2,
      width: size, height: size,
      preserveAspectRatio: 'xMidYMid slice', class: 'emblem', 'data-faction': key,
      'clip-path': `url(#${bcid})`,
      filter: key === myFaction ? 'none' : 'url(#dimBadge)',
      opacity: key === myFaction ? '1' : '0.8',
    }, emblemLayer);
    im.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', EMBLEMS[key]); // X5/老 WebKit 兜底
    el('circle', {
      cx: r.cx, cy: r.cy - 14, r: size / 2 + 0.6, fill: 'none',
      stroke: key === myFaction ? f.accent : 'rgba(255,255,255,0.16)',
      'stroke-width': key === myFaction ? '1.6' : '0.8',
    }, emblemLayer);

    // 阵营名 + 人数
    const t = el('text', {
      x: r.cx, y: r.cy + 36, class: 'q-name', 'text-anchor': 'middle',
      fill: key === myFaction ? f.accent : 'rgba(233,238,250,0.72)',
    }, labelLayer);
    t.textContent = f.label;
    const c = el('text', {
      x: r.cx, y: r.cy + 55, class: 'q-count', 'text-anchor': 'middle',
      fill: key === myFaction ? 'rgba(255,255,255,0.92)' : 'rgba(233,238,250,0.62)',
    }, labelLayer);
    c.textContent = `${counts[key] ?? 0} 人`;
    const qq = ATLAS.quadrantOf[key];
    const no = el('text', {
      x: qq.sx === 'neg' ? r.x + 7 : r.x + r.w - 7, y: qq.sy === 'pos' ? r.y + 13 : r.y + r.h - 6,
      class: 'q-no', 'text-anchor': qq.sx === 'neg' ? 'start' : 'end',
      fill: 'rgba(233,238,250,0.26)',
    }, labelLayer);
    no.textContent = ATLAS.quadrantOf[key].no;
  }

  // 中心融合罩
  el('rect', { x: -R, y: -R, width: R * 2, height: R * 2, fill: 'url(#centerMerge)', 'pointer-events': 'none' }, scene);

  // ── 坐标轴 ──────────────────────────────────────────────────────────
  const axis = el('g', { class: 'axis', 'pointer-events': 'none' }, scene);
  el('line', { x1: -R, y1: 0, x2: R, y2: 0, stroke: 'rgba(255,255,255,0.22)', 'stroke-width': '0.8', 'stroke-dasharray': '4 4' }, axis);
  el('line', { x1: 0, y1: -R, x2: 0, y2: R, stroke: 'rgba(255,255,255,0.22)', 'stroke-width': '0.8', 'stroke-dasharray': '4 4' }, axis);

  // 四端点：图标 + 「神器 · 概念」
  // 四端点全部落在象限外侧，锚点统一居中，避免压住底色
  // 上下：单行「权杖 · 制度」；左右：两行竖排（神器 / 概念），避免压住象限底色或出血
  const ends = [
    { pos: 'top',    ix: 0,         iy: -(R + 31), lines: null, tx: 0,         ty: -(R + 15) },
    { pos: 'bottom', ix: 0,         iy: (R + 17),  lines: null, tx: 0,         ty: (R + 33) },
    { pos: 'left',   ix: -(R + 15), iy: -16,       lines: true, tx: -(R + 15), ty: 0 },
    { pos: 'right',  ix: (R + 15),  iy: -16,       lines: true, tx: (R + 15),  ty: 0 },
  ];
  for (const e of ends) {
    const cfg = ATLAS.axisEnds[e.pos];
    const art = ARTIFACTS[cfg.artifact];
    const g = el('g', { class: 'axis-end' }, axis);
    // 神器 icon（灰态，裁自设计稿倾向槽）
    const isz = 17;
    const aim2 = el('image', {
      href: ICONS.dim[cfg.artifact], x: e.ix - isz / 2, y: e.iy - isz / 2,
      width: isz, height: isz, opacity: '0.95',
    }, g);
    aim2.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', ICONS.dim[cfg.artifact]);
    const parts = cfg.text.split(' · ');
    if (e.lines) {
      parts.forEach((txt, i) => {
        const t = el('text', {
          x: e.tx, y: e.ty + i * 11, class: 'axis-text', 'text-anchor': 'middle',
          fill: i === 0 ? 'rgba(233,238,250,0.72)' : 'rgba(233,238,250,0.5)',
        }, g);
        t.textContent = txt;
      });
    } else {
      const t = el('text', {
        x: e.tx, y: e.ty, class: 'axis-text', 'text-anchor': 'middle',
        fill: 'rgba(233,238,250,0.66)',
      }, g);
      t.textContent = cfg.text;
    }
  }

  // ── 星点（人物）+ 我的位置 ───────────────────────────────────────────
  const starLayer = el('g', { class: 'stars', 'pointer-events': 'none' }, scene);
  const figNodes = [];
  for (const [key, list] of Object.entries(FIGURES)) {
    for (const fig of list) {
      const g = el('g', { class: 'fig', 'data-faction': key, opacity: '1' }, starLayer);
      // 定位组：所有子元素画在原点，放大态只需给头像组加 scale 反缩放
      const at = el('g', { transform: `translate(${sx(fig.x)},${sy(fig.y)})` }, g);
      const star = el('path', {
        d: starPath(0, 0, 5.2),
        fill: FACTIONS[key].accent, opacity: '0.8',
        stroke: 'rgba(255,255,255,0.5)', 'stroke-width': '0.5',
        filter: 'url(#starGlow)', class: 'star',
      }, at);
      // 放大态：缩略头像 + 姓名（默认隐藏）
      const av = el('g', { class: 'avatar', opacity: '0', style: 'pointer-events:none' }, at);
      const AR = 13;
      if (fig.avatar) {
        const cid = makeAvatarClip(AR);
        el('circle', { cx: 0, cy: 0, r: AR, fill: FACTIONS[key].accent, opacity: '0.35' }, av);
        const aim = el('image', {
          href: fig.avatar, x: -AR, y: -AR, width: AR * 2, height: AR * 2,
          preserveAspectRatio: 'xMidYMid slice', 'clip-path': `url(#${cid})`,
        }, av);
        aim.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', fig.avatar);
      } else {
        el('circle', { cx: 0, cy: 0, r: AR, fill: FACTIONS[key].accent, opacity: '0.92' }, av);
        const ini = el('text', { x: 0, y: 4.6, 'text-anchor': 'middle', class: 'avatar-ini', fill: '#fff' }, av);
        ini.textContent = fig.name.replace(/[·•]/g, '')[0];
      }
      // 金环（对齐设计稿「你可能更像」的金色描边）
      el('circle', { cx: 0, cy: 0, r: AR, fill: 'none', stroke: '#D9A441', 'stroke-width': '1.2', opacity: '0.95' }, av);
      const nm = el('text', { x: 0, y: AR + 13, 'text-anchor': 'middle', class: 'avatar-name', fill: 'rgba(240,244,255,0.94)' }, av);
      nm.textContent = fig.name;
      const ti = el('text', { x: 0, y: AR + 23, 'text-anchor': 'middle', class: 'avatar-title', fill: 'rgba(233,238,250,0.55)' }, av);
      ti.textContent = fig.title || '';
      figNodes.push({ faction: key, g, star, av });
    }
  }

  // 我的位置 —— 与他人星点强区分：扩散脉冲环 ×2 + 光晕 + 白心 + 「你」标签
  const acc = FACTIONS[myFaction].accent;
  const me = el('g', {
    class: 'me', 'pointer-events': 'none',
    transform: `translate(${sx(myCoord.x)},${sy(myCoord.y)})`,
  }, scene);
  for (const d of [0, 1]) {
    const ring = el('g', { class: 'me-pulse' }, me);
    ring.style.animationDelay = `${d * 1.15}s`;
    el('circle', { cx: 0, cy: 0, r: 7, fill: 'none', stroke: acc, 'stroke-width': '1.7' }, ring);
  }
  el('circle', { cx: 0, cy: 0, r: 12, fill: acc, opacity: '0.20' }, me);
  el('circle', { cx: 0, cy: 0, r: 5.8, fill: acc, stroke: '#fff', 'stroke-width': '1.7' }, me);
  el('circle', { cx: 0, cy: 0, r: 2, fill: '#fff' }, me);
  const meTag = el('text', { x: 0, y: -14.5, 'text-anchor': 'middle', class: 'me-label', fill: '#fff' }, me);
  meTag.textContent = '你';

  // ── 交互：点击象限 zoom ──────────────────────────────────────────────
  // 放大态信息面板
  const panel = document.createElement('div');
  panel.className = 'atlas-panel';
  panel.style.display = 'none';
  root.insertBefore(panel, wrap);   // 走文档流，避免遮挡平面顶部

  let zoomed = null;
  let raf = null;

  function tweenViewBox(to, dur = 460, onDone) {
    const from = svg.getAttribute('viewBox').split(/\s+/).map(Number);
    const t0 = performance.now();
    if (raf) cancelAnimationFrame(raf);
    const step = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const k = easeInOut(p);
      const v = from.map((f, i) => f + (to[i] - f) * k);
      svg.setAttribute('viewBox', v.join(' '));
      if (p < 1) raf = requestAnimationFrame(step);
      else if (onDone) onDone();
    };
    raf = requestAnimationFrame(step);
  }

  function zoomTo(key) {
    zoomed = key;
    const q = ATLAS.quadrantOf[key];
    const x = q.sx === 'neg' ? -R : 0;
    const y = q.sy === 'pos' ? -R : 0;
    const m = 14;
    const box = R + m * 2;
    // viewBox 放大 k 倍 → 头像组反向缩放 1/k，保证屏幕上尺寸恒定
    const k = VIEW_FULL[2] / box;
    tweenViewBox([x - m, y - m, box, box]);
    for (const n of figNodes) n.av.setAttribute('transform', `scale(${(1 / k).toFixed(4)})`);
    labelLayer.setAttribute('opacity', '0');   // 象限名/人数交给顶部面板
    axis.setAttribute('opacity', '0');         // 轴标签在放大态会被裁切，直接淡出
    // 进入某阵营即「点亮」它：解除去色
    for (const im2 of emblemLayer.querySelectorAll('.emblem')) {
      const on = im2.getAttribute('data-faction') === key;
      im2.setAttribute('filter', on ? 'none' : 'url(#dimBadge)');
      im2.setAttribute('opacity', on ? '0.55' : '0.35');   // 放大态压低作背景，让人物突出
    }
    // 星星 → 头像+姓名；非本象限淡出
    for (const n of figNodes) {
      const mine = n.faction === key;
      n.g.setAttribute('opacity', mine ? '1' : '0');
      n.star.setAttribute('opacity', mine ? '0' : '0.8');
      n.av.setAttribute('opacity', mine ? '1' : '0');
      n.av.style.pointerEvents = mine ? 'auto' : 'none';
    }
    root.classList.add('is-zoomed');
    me.setAttribute('opacity', key === myFaction ? '1' : '0');
    panel.style.display = 'flex';
    const f = FACTIONS[key];
    panel.innerHTML = `
      <div class="p-emblem"><img src="${EMBLEMS[key]}" alt=""></div>
      <div class="p-body">
        <div class="p-name" style="color:${f.accent}">${f.label}</div>
        <div class="p-arts">${f.artifacts.map(a => artifactLabel(a)).join('　')}</div>
        <div class="p-tag">${f.tagline}</div>
      </div>
      <button class="p-back" type="button">返回</button>`;
    panel.querySelector('.p-back').onclick = (e) => { e.stopPropagation(); zoomOut(); };
  }

  function zoomOut() {
    zoomed = null;
    tweenViewBox(VIEW_FULL);
    labelLayer.setAttribute('opacity', '1');
    axis.setAttribute('opacity', '1');
    for (const im2 of emblemLayer.querySelectorAll('.emblem')) {
      const on = im2.getAttribute('data-faction') === myFaction;
      im2.setAttribute('filter', on ? 'none' : 'url(#dimBadge)');
      im2.setAttribute('opacity', on ? '1' : '0.8');
    }
    for (const n of figNodes) {
      n.g.setAttribute('opacity', '1');
      n.star.setAttribute('opacity', '0.8');
      n.av.setAttribute('opacity', '0');
      n.av.style.pointerEvents = 'none';
    }
    root.classList.remove('is-zoomed');
    me.setAttribute('opacity', '1');
    panel.style.display = 'none';
  }

  svg.addEventListener('click', (ev) => {
    if (zoomed) { zoomOut(); return; }   // 放大态点画面任意处返回
    const q = ev.target.closest('.quad');
    if (q) zoomTo(q.dataset.faction);
  });

  // ── 你的阵营 · 代表人物（占位头像，[SLOT] 待真头像）──────────────────
  const strip = document.createElement('div');
  strip.className = 'figstrip';
  const mine = FIGURES[myFaction] || [];
  strip.innerHTML = `
    <div class="figstrip-hd"><b>代表人物</b><span>${FACTIONS[myFaction].label} · 共 ${mine.length} 位</span></div>
    <div class="figstrip-list">
      ${mine.map((f, i) => `
        <div class="figcard" data-i="${i}">
          <div class="av" style="${f.avatar ? `background-image:url(${f.avatar})` : `background:${FACTIONS[myFaction].accent}`}">${f.avatar ? '' : f.name.replace(/[·•]/g, '')[0]}</div>
          <div class="nm2">${f.name}</div>
          <div class="ti2">${f.title || ''}</div>
        </div>`).join('')}
    </div>`;
  root.appendChild(strip);
  // 人物条：触屏原生横滚；桌面补鼠标拖拽 + 滚轮横滚
  const fsList = strip.querySelector('.figstrip-list');
  let fsDown = false, fsX = 0, fsL = 0, fsMoved = false;
  fsList.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse') return;
    fsDown = true; fsMoved = false; fsX = e.clientX; fsL = fsList.scrollLeft;
    fsList.setPointerCapture(e.pointerId);
  });
  fsList.addEventListener('pointermove', (e) => {
    if (!fsDown) return;
    const dx = e.clientX - fsX;
    if (Math.abs(dx) > 4) fsMoved = true;
    fsList.scrollLeft = fsL - dx;
  });
  const fsUp = () => { fsDown = false; };
  fsList.addEventListener('pointerup', fsUp);
  fsList.addEventListener('pointercancel', fsUp);
  fsList.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { fsList.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });

  // 点人物 → 放大到本阵营象限（拖拽后的收尾 click 不算点击）
  fsList.addEventListener('click', (e) => {

          wrap.style.height = '100%';
        }
      });
    }

    /* ── 阵营结果页（四象限） ── */
    function renderAtlas() {
      const r = computeResult(state.answers, bank);
      app.innerHTML = `
        <div class="topbar"><button class="back" id="bk">‹</button><div class="tt">思维坐标</div><div class="sp"></div></div>
        <div id="atlasHost" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto"></div>`;
      mountAtlas(document.getElementById('atlasHost'), {
        faction: r.faction,
        coordinate: r.coordinate,
        counts: { tower: 54, court: 38, forge: 46, harbor: 50 },  // [SLOT] 真实人数待接口
      });
      document.getElementById('bk').onclick = () => { state.phase = 'result'; render(); };
    }

    function hex(c, a) { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

    window.__setAnswers = (ans) => { state.answers = ans; state.phase = 'result'; render(); }; // 自动化验证钩子
    render();
  
</script>
